# Verification in CI. The tiers match the Makefile and AGENTS.md.
# Unverified: this workflow has not run on GitHub yet.
#
# Each pull request and push runs all model tiers, ProVerif, and Kani.
# No path filter can omit a relevant model or shared-tool change.
name: verify

permissions:
  contents: read

defaults:
  run:
    shell: bash

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"

# A new push to a pull request cancels the run for the previous push. Its
# results are out of date, and its jobs hold runners that the new run needs.
# A push to main and the nightly run are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The commit that the drift and mutants-diff gates compare with.
  # Pull request: the base branch tip. Push: the tip before the push.
  # Both gates fail if this is not a valid commit, for example on a new branch.
  BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

jobs:
  check:
    # The gate for each commit: Rust lint, tests, licences, runner tests, the
    # Prometheus rule tests (make test-rules) and the fast Quint tier.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      # rust-toolchain.toml pins the stable toolchain. Install it explicitly.
      - run: rustup toolchain install --profile minimal
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
      # Quint downloads its evaluator with no token and can reach the API rate limit.
      - run: make quint-evaluator
        env:
          GH_TOKEN: ${{ github.token }}
      # Cache the dependency builds. cargo-mutants copies the tree without
      # target/, so the mutants job gets no gain from this cache. The fuzz
      # crate builds with the Kani nightly, so its name is part of the key.
      # Only main saves a cache, so pull request caches do not fill the 10 GB
      # repository quota and evict the mise and QEMU caches.
      - id: nightly
        run: echo "name=$(sed -n 's/^NIGHTLY_NAME := //p' Makefile)" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ steps.nightly.outputs.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            . -> target
            crates/protocol/fuzz -> target
      # cargo kani setup installs the nightly that fuzz and the fuzz lint need.
      # A restored mise cache skips the postinstall hook, so run it here.
      - run: mise exec -- cargo kani setup
      # The Kani nightly has no clippy or rustfmt. The fuzz crate lint needs both.
      - run: make rust-nightly-components
      # make check runs make test-demo, which includes the M3 to M5 acceptance
      # tests (demo/tests/test_integrity.py, test_enrollment.py, test_users.py).
      - run: make check
      - if: github.event_name != 'schedule'
        run: make verify-drift BASE="$BASE"

  swift:
    # DESIGN.md M1: the shared vectors through the Swift binding on an iOS
    # simulator and on macOS. Linux runners have no Xcode.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install --profile minimal
      - run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim aarch64-apple-darwin
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
      # One cache for the Apple jobs. The app job builds the Rust of this job
      # (the XCFramework) and the relay, so only the app job saves the cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: apple
          save-if: false
      - id: sim
        run: |
          id=$(bindings/scripts/ios-sim.sh)
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - run: make test-swift DEVELOPER_DIR="$(xcode-select -p)" IOS_SIM="platform=iOS Simulator,id=$SIM_ID"
        env:
          SIM_ID: ${{ steps.sim.outputs.id }}

  app:
    # DESIGN.md M6: the Swift sample app on an iOS simulator and on macOS,
    # with no signing, against a relay process (make test-app): the unit
    # tests, the UI tests of S4, S5 and the key replacement, and the check
    # that a Release build has no UI test seam. The macOS keychain tests
    # check the fail-closed path, because an unsigned build has no keychain
    # entitlement.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install --profile minimal
      - run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim aarch64-apple-darwin
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: apple
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - id: sim
        run: |
          id=$(bindings/scripts/ios-sim.sh)
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - run: make test-app DEVELOPER_DIR="$(xcode-select -p)" IOS_SIM="platform=iOS Simulator,id=$SIM_ID"
        env:
          SIM_ID: ${{ steps.sim.outputs.id }}

  image:
    # DESIGN.md "Relay deployment": the static musl image for each
    # architecture, with vendored OpenSSL. Each runner builds its own
    # architecture natively. CI does not push the image.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: docker build --platform linux/${{ matrix.arch }} -t snailfish-relay:ci .
      - name: The container reports healthy and serves /v1/info
        run: |
          docker run -d --name relay -e SNAILFISH_AUTHORITY=localhost:8080 -p 8080:8080 snailfish-relay:ci
          for _ in $(seq 60); do
            s=$(docker inspect -f '{{.State.Health.Status}}' relay)
            if [ "$s" = healthy ]; then break; fi
            sleep 1
          done
          test "$s" = healthy
          test "$(docker image inspect -f '{{.Config.User}}' snailfish-relay:ci)" = nonroot:nonroot
          curl -fsS localhost:8080/v1/info | jq -e '.levels == [1]'
          docker stop -t 10 relay
          test "$(docker inspect -f '{{.State.ExitCode}}' relay)" = 0
      - name: The relay does not start without an authority
        run: |
          if docker run --rm snailfish-relay:ci; then exit 1; fi

  powerloss:
    # DESIGN.md M2: SIGKILL a QEMU VM during push and pull. The disks use
    # cache=none. This covers Linux fsync in the guest, under KVM.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install QEMU and allow KVM
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends qemu-system-x86 qemu-utils genisoimage
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          # Some runners apply the rule late. Set the mode directly too.
          if [ -e /dev/kvm ] && [ ! -w /dev/kvm ]; then sudo chmod 0666 /dev/kvm; fi
          ls -l /dev/kvm || { echo "FAIL: this runner has no /dev/kvm"; exit 1; }
          test -w /dev/kvm
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/snailfish-qemu
          key: debian-13-genericcloud-amd64-20261021-2638
      - run: make test-powerloss ARCH=amd64 KILLS=20

  models:
    # The model list comes from specs/*/checks.toml, so a new model is picked up.
    runs-on: ubuntu-24.04
    outputs:
      models: ${{ steps.list.outputs.models }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: list
        run: |
          models=$(for f in specs/*/checks.toml; do test -f "$f" || exit 1; basename "$(dirname "$f")"; done | jq -R . | jq -sc .)
          test "$models" != "[]"
          echo "models=$models" >> "$GITHUB_OUTPUT"

  full:
    # Every Quint config, limit, mutant and witness, one job per model. A CI
    # runner has fewer cores than a developer machine, so it samples 5000
    # traces instead of 20000. A developer runs the full count before a merge.
    needs: models
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.models.outputs.models) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install --profile minimal
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
      # Quint downloads its evaluator with no token and can reach the API rate limit.
      - run: make quint-evaluator
        env:
          GH_TOKEN: ${{ github.token }}
      - run: make verify-tools
      - run: mise exec -- uv run --script specs/tools/verify.py full "$MODEL" --samples 5000
        env:
          MODEL: ${{ matrix.model }}

  deep-quint:
    # Apalache and TLC, one job per model.
    needs: models
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.models.outputs.models) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install --profile minimal
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
      # Quint downloads its evaluator with no token and can reach the API rate limit.
      - run: make quint-evaluator
        env:
          GH_TOKEN: ${{ github.token }}
      - run: make verify-deep MODEL="$MODEL"
        env:
          MODEL: ${{ matrix.model }}

  kani:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install --profile minimal
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
      - run: mise exec -- cargo kani setup
      # A runner has 16 GB. decode_never_panics alone uses about 10.5 GB and
      # frame_layout about 9 GB, so two runs at once can stop the runner. One
      # at a time takes about 5 minutes.
      - run: make rust-kani KANI_JOBS=1

  crypto:
    # ProVerif 2.05 models of enrollment. setup-ocaml installs opam and an OCaml compiler.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1
        with:
          ocaml-compiler: "4.14.2"
      - run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk2.0-dev libexpat1-dev pkg-config
      - run: opam install proverif.2.05 --yes
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
      - run: make verify-crypto

  mutants:
    # cargo-mutants in 8 shards. Each mutant runs the whole workspace test
    # suite, so one runner needs hours. A pull request and a push check the
    # mutants of the changed Rust code. The nightly run checks every mutant.
    # Sharding is by mutant index, so the shards cover each mutant once.
    # The nightly run has about 480 mutants in each shard, and most shards
    # take more than 2 hours.
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'schedule' && 300 || 120 }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: rustup toolchain install --profile minimal
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
      - if: github.event_name != 'schedule'
        run: make rust-mutants-diff BASE="$BASE" MUTANTS_JOBS=2 MUTANTS_SHARD=${{ matrix.shard }}/8
      - if: github.event_name == 'schedule'
        run: make rust-mutants MUTANTS_JOBS=2 MUTANTS_SHARD=${{ matrix.shard }}/8

  fuzz:
    # A short run of every fuzz target on each push, so a new parser target
    # (M3: repair and status, M4: enroll_code and mailbox, M5: setup) runs before the merge. `make rust-fuzz` runs
    # each target that `cargo fuzz list` names, from its seeds.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install --profile minimal
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
      - id: nightly
        run: echo "name=$(sed -n 's/^NIGHTLY_NAME := //p' Makefile)" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ steps.nightly.outputs.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: crates/protocol/fuzz -> target
      - run: mise exec -- cargo kani setup
      - run: make rust-fuzz FUZZ_SECONDS=30

  nightly-fuzz:
    # Long fuzz runs. Nightly only.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install --profile minimal
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
      - run: mise exec -- cargo kani setup
      - run: make rust-fuzz FUZZ_SECONDS=600

  gate:
    # The one required status check of the main ruleset. It fails if a job
    # failed or was cancelled, so a new job or model needs no ruleset
    # change. A job that its condition skips (nightly-fuzz) passes.
    if: always()
    needs: [check, swift, app, image, powerloss, models, full, deep-quint, kani, crypto, mutants, fuzz]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [ "$FAILED" = "true" ]; then echo "FAIL: a required job failed or was cancelled"; exit 1; fi
