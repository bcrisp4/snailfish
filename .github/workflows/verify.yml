# Verification in CI. The tiers match the Makefile and AGENTS.md.
# Unverified: this workflow has not run on GitHub yet.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # The gate for each commit: Rust lint, tests, licences and the fast Quint tier.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # rust-toolchain.toml pins the stable toolchain. Install it explicitly.
      - run: rustup toolchain install --profile minimal
      - uses: jdx/mise-action@v2
      # cargo kani setup installs the nightly that fuzz and the fuzz lint need.
      # A restored mise cache skips the postinstall hook, so run it here.
      - run: mise exec -- cargo kani setup
      - run: make check
      # A pull request checkout has no local main branch.
      - run: git fetch origin main:main || true
      - run: make verify-drift
      # Mutants in the Rust code that this pull request, or this push, changed.
      # A push to main compares with the commit before the push.
      - run: make rust-mutants-diff BASE=${{ github.event_name == 'pull_request' && 'main' || github.event.before }}

  full:
    # Every Quint config, limit, mutant and witness, one job per model. A CI
    # runner has fewer cores than a developer machine, so it samples 5000
    # traces instead of 20000. A developer runs the full count before a merge.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        model: [delivery, spacelog]
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install --profile minimal
      - uses: jdx/mise-action@v2
      - run: make verify-tools
      - run: mise exec -- uv run --script specs/tools/verify.py full ${{ matrix.model }} --samples 5000

  rust-mutants:
    # Every mutant of every crate. The check job runs only the changed code.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install --profile minimal
      - uses: jdx/mise-action@v2
      - run: make rust-mutants

  deep:
    # Slow, bounded exhaustive checks. Nightly only.
    # ProVerif (make verify-crypto) needs opam. It runs on developer machines only.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install --profile minimal
      - uses: jdx/mise-action@v2
      - run: mise exec -- cargo kani setup
      - run: make verify-deep
      - run: make rust-kani
      - run: make rust-fuzz FUZZ_SECONDS=600
