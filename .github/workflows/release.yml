# Make a GitHub release from a tag v<version>. The release notes are the
# "## [<version>]" section of CHANGELOG.md. A tag with no section stops the
# run, so each release has notes. The Python package has its own workflow
# (release-python.yml) and its own py-v<version> tags.
name: release

permissions:
  contents: read

defaults:
  run:
    shell: bash

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # gh release create needs write access to the repository contents.
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Extract the release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "FAIL: CHANGELOG.md has no section \"## [$version]\" with notes"
            exit 1
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
