# cargo-deny: licences, advisories, bans and sources. Run `cargo deny check`.

[graph]
all-features = true

[advisories]
# A RUSTSEC advisory on any dependency fails the check.
yanked = "deny"
ignore = [
  # basic-toml is unmaintained, with no known vulnerability. Only the UniFFI
  # code generator uses it (uniffi_bindgen 0.32.2 -> askama 0.16.1), at build
  # time. No UniFFI release removes it yet. Remove this entry when one does.
  { id = "RUSTSEC-2026-0374", reason = "unmaintained, build-time only through uniffi_bindgen" },
]

[licenses]
# DESIGN.md "Licensing": every crate is MIT OR Apache-2.0, so each dependency
# must have a licence that is compatible with both.
# UniFFI runtime code is MPL-2.0 (an integrator note in DESIGN.md).
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
]
confidence-threshold = 0.9
# webpki-roots is the Mozilla CA root list that the relay webhook client
# trusts (M5). The data has the permissive CDLA-Permissive-2.0 licence, which
# allows use and redistribution with MIT and Apache-2.0 code. Only this
# crate may use it.
exceptions = [{ crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] }]
# The allow list covers licences that M1 dependencies will bring.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside this workspace are not wildcards from a registry.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
