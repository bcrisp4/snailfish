[package]
name = "snailfish-uniffi-bindgen"
description = "The UniFFI binding generator at the version that snailfish-bindings uses."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
uniffi = { workspace = true, features = ["cli"] }

[lints]
workspace = true

[dev-dependencies]
serde_json = "1"
tempfile = "3"
