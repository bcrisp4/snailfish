[package]
name = "snailfish-relay"
description = "Snailfish relay: the protocol crate plus HTTP and tenant storage."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The WebAuthn passkey sign-in of M5 needs OpenSSL. This feature links
# `webauthn-rs` with a vendored OpenSSL, so the container build is proven early.
webauthn = ["dep:webauthn-rs", "dep:openssl"]

[dependencies]
snailfish-protocol.workspace = true
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.4"
rusqlite = { version = "0.41", features = ["bundled"] }
serde_json = "1"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "signal",
  "time",
] }
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["timeout"] }
data-encoding = "2"
openssl = { version = "0.10", features = ["vendored"], optional = true }
webauthn-rs = { version = "0.5", optional = true }

[dev-dependencies]
hex = "0.4"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
