[package]
name = "snailfish-relay"
description = "Snailfish relay: the protocol crate plus HTTP and tenant storage."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# A test-only way to issue an authorization code without a browser, for the
# engine tests that run the setup token exchange against the real relay core.
test-support = []

[dependencies]
snailfish-protocol.workspace = true
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.4"
http-body-util = "0.1"
rusqlite = { version = "0.41", features = ["backup", "bundled"] }
serde_json = "1"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "signal",
  "time",
] }
tower = { version = "0.5", features = ["limit"] }
data-encoding = "2"
hmac = "0.13"
http = "1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# webauthn-rs 0.5 needs OpenSSL. The vendored build keeps the binary static.
openssl = { version = "0.10", features = ["vendored"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
tokio-rustls = { version = "0.26", default-features = false, features = [
  "ring",
  "tls12",
] }
webauthn-rs = "0.5"
webpki-roots = "1"

[dev-dependencies]
hex = "0.4"
# The tests use the test-support API.
snailfish-relay = { path = ".", features = ["test-support"] }
serde_cbor_2 = "0.13"
http-body = "1"
tokio = { version = "1", features = ["test-util", "io-util"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
