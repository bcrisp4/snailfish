[package]
name = "snailfish-engine"
description = "Snailfish sync engine: the protocol crate plus the sync state machine and its SQLite state."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23"
rusqlite = { version = "0.41", features = ["bundled"] }
serde_json = "1"
snailfish-protocol.workspace = true

[lints]
workspace = true

[dev-dependencies]
hex = "0.4"
# The real relay core, called without a runtime, for model-to-Rust
# conformance tests (specs/conformance.md).
snailfish-relay = { path = "../relay", features = ["test-support"] }
tempfile = "3"
