[package]
name = "snailfish-bindings"
description = "UniFFI Swift and Python bindings for the Snailfish sync engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# cdylib for the Python binding, staticlib for the Swift XCFramework, and lib
# for Rust tests and for crates/uniffi-bindgen.
crate-type = ["lib", "cdylib", "staticlib"]
name = "snailfish"

[dependencies]
snailfish-engine.workspace = true
uniffi.workspace = true

[lints]
workspace = true

[dev-dependencies]
hex = "0.4"
# The real relay core for the sync test through the binding.
snailfish-relay = { path = "../relay", features = ["test-support"] }
serde_json = "1"
tempfile = "3"
