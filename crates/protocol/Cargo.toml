[package]
name = "snailfish-protocol"
description = "Snailfish record types, envelopes, signature input, verification, log digests and space state. No I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23"
chacha20poly1305 = "0.11"
ed25519-dalek = "3"
getrandom = "0.4"
hkdf = "0.13"
hpke = { version = "0.14", default-features = false, features = [
  "alloc",
  "mlkem",
  "chacha",
  "x25519",
  "hkdfsha2",
  "getrandom",
] }
serde = "1"
serde_json = "1"
sha2 = "0.11"

[features]
# Deterministic encryption and sealing for the shared test vectors. A repeated
# nonce or encapsulation breaks the crypto, so production builds leave it off.
test-vectors = []

[dev-dependencies]
# The integration tests in tests/ need the test-vectors API.
snailfish-protocol = { path = ".", features = ["test-vectors"] }
hex = "0.4"
hpke = { version = "0.14", default-features = false, features = [
  "alloc",
  "mlkem",
  "chacha",
  "x25519",
  "hkdfsha2",
  "getrandom",
] }
proptest.workspace = true

[lints]
workspace = true
