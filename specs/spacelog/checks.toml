# Checks for the space log model. specs/tools/verify.py reads this file.
# Each [config] binds every const of model.qnt. verify.py generates one module
# file for each config and each mutant in specs/spacelog/_gen/.

model = "model.qnt"
module = "spacelog"
tests = "test.qnt"
test_module = "spacelogTest"
# Extra test modules with other consts: 4 devices, and a thief.
test_modules = ["spacelogTest4", "spacelogTestThief", "spacelogTestCompromised"]

# Invariants that hold in every config unless a config lists it under `skip`
# or a [[limits]] entry names it.
invariants = [
  "authorActive", "noKeyToRemoved", "removedKeyIsolation", "baseRule",
  "activeSetDeterministic", "grantAuthorized", "forkStops", "baseInOwnLog",
  "writeEpochCurrent", "relayLogValid", "logChangeEpoch", "noFork",
  "noStaleChangeStored", "grantSealsAllKeys", "epochSequential", "noSelfRemoval",
  "grantSubjectNew", "grantConfirmed",
]

witness_configs = ["honest", "forkRelay", "forgeRelay", "reorderRelay", "thief",
                   "compromisedHonest", "compromisedReorder"]
witness_steps = 40

fast_config = "honest"

[deep]
config = "honest"
invariants = ["authorActive", "noKeyToRemoved", "baseRule", "activeSetDeterministic"]
max_steps = 8

[defaults]
DEVS = "Set(1, 2)"
BAD = "Set()"
MAX_REC = "6"
MAX_ATTACKS = "0"
FAULTS = "Set()"
BUG = '"none"'

# ---------------------------------------------------------------- configs

[configs.honest]

[configs.forkRelay]
MAX_ATTACKS = "3"
FAULTS = 'Set("fork")'
skip = ["noFork", "noStaleChangeStored"]
why = "A fork can split honest devices on two valid branches (limit T7). A withheld epoch record can store a stale change (limit T8). Both are checked in the limit entries."

[configs.forgeRelay]
MAX_ATTACKS = "2"
FAULTS = 'Set("forge")'
skip = ["relayLogValid"]
why = "A malicious relay appends a record with no signature, so its log is not valid by design. Only an honest relay promises relayLogValid (checked in honest and thief)."

[configs.reorderRelay]
MAX_ATTACKS = "3"
FAULTS = 'Set("reorder")'
skip = ["relayLogValid", "noStaleChangeStored"]
why = "A malicious relay appends records in any order, so its log is not valid by design (relayLogValid). It can also store a change after a later epoch record (limit T8, checked in forkRelay)."

# wThiefSigned needs about 14 exact steps: enrolment, a removal, and a submit
# from the removed thief. With 6 records a stray record often uses up the ids
# first (4 traces in 5000). 9 records give about 46 in 5000. 9 is the maximum:
# dig packs each id into two decimal digits of an int64.
[configs.thief]
BAD = "Set(2)"
FAULTS = 'Set("recovery")'
MAX_REC = "9"

# A device key that an attacker controls signs bounded invalid records (signInvalid).
# The adversary has MAX_ATTACKS actions in total, shared with the malicious relay.
# Honest relay: the relay must refuse each invalid record.
[configs.compromisedHonest]
DEVS = "Set(1, 2, 3)"
BAD = "Set(2)"
FAULTS = 'Set("signedInvalid")'
MAX_ATTACKS = "1"
MAX_REC = "4"

# Malicious relay that stores any signed record: each device must reject it.
[configs.compromisedReorder]
DEVS = "Set(1, 2, 3)"
BAD = "Set(2)"
FAULTS = 'Set("signedInvalid", "reorder")'
MAX_ATTACKS = "2"
MAX_REC = "4"
skip = ["relayLogValid", "noStaleChangeStored"]
why = "A malicious relay stores records in any order, so its log is not valid by design (relayLogValid), and can store a stale change (limit T8)."

# Baseline for the base-rule and key mutants. Two devices are not enough: with
# 2 devices, each pair of security records fails another check before the base
# rule, so those mutants change no verdict (finding S1).
[configs.honest4]
DEVS = "Set(1, 2, 3, 4)"
MAX_REC = "8"
check_only = ["baseRule", "relayLogValid"]
why = "Each 4-device run takes about 15 minutes. The baseline needs only the invariants that its mutants are caught by. honest checks the rest with 2 devices."

# Small configs for TLC (make verify-deep). TLC checks every reachable state.
[configs.tinyHonest]
MAX_REC = "4"

[configs.tinyHonest4]
DEVS = "Set(1, 2, 3, 4)"
MAX_REC = "3"
check_only = ["baseRule", "relayLogValid"]
why = "The base-rule mutants need 4 devices (finding S1). TLC checks only their invariants here."

[configs.tinyThief]
BAD = "Set(2)"
FAULTS = 'Set("recovery")'
MAX_REC = "4"

[configs.tinyFork]
FAULTS = 'Set("fork")'
MAX_ATTACKS = "1"
MAX_REC = "4"
skip = ["noFork", "noStaleChangeStored", "relayLogValid"]
why = "A fork breaks noFork and noStaleChangeStored (limits T7 and T8). relayLogValid holds only for an honest relay."

[configs.tinyCompromised]
DEVS = "Set(1, 2)"
BAD = "Set(2)"
FAULTS = 'Set("signedInvalid", "reorder")'
MAX_ATTACKS = "2"
MAX_REC = "3"
skip = ["relayLogValid", "noStaleChangeStored", "noFork"]
why = "A malicious relay stores records in any order (relayLogValid, T8). Two attacks give no two running honest devices, so noFork is moot here."

# ---------------------------------------------------------------- known limits

[[limits]]
config = "forkRelay"
invariant = "noFork"
why = "T7: a malicious relay serves two valid branches to two devices. Neither device sees a conflict until it compares logs."

[[limits]]
config = "forkRelay"
invariant = "noStaleChangeStored"
why = "T8 limit: a relay that withholds an epoch record from a stayed device can store that device's change under the old epoch."

# ---------------------------------------------------------------- mutants

[mutants.noBaseRule]
base = "honest4"
caught_by = "baseRule"

[mutants.relayNoBaseRule]
base = "honest4"
caught_by = "relayLogValid"

[mutants.relaySkipsCheck]
base = "honest"
caught_by = "relayLogValid"

[mutants.verifierIgnoresRemovals]
base = "honest"
caught_by = "activeSetDeterministic"

[mutants.epochSealsToAll]
base = "honest"
caught_by = "noKeyToRemoved"

[mutants.trustsRelayVerdict]
base = "forgeRelay"
caught_by = "grantAuthorized"

[mutants.noSigCheck]
base = "forgeRelay"
caught_by = "grantAuthorized"

[mutants.baseUnchecked]
base = "forkRelay"
caught_by = "baseInOwnLog"

[mutants.grantFromRemoved]
base = "thief"
caught_by = "tests"
test_module = "spacelogTestThief"
test = "thiefGrantTest"

[mutants.regrantRemoved]
base = "honest"
caught_by = "noKeyToRemoved"

[mutants.epochUnchecked]
base = "honest"
caught_by = "logChangeEpoch"

[mutants.staleWriteEpoch]
base = "honest"
caught_by = "writeEpochCurrent"

[mutants.resignReusesKey]
base = "honest4"
caught_by = "tests"
test_module = "spacelogTest4"
test = "resignTest"

# Each mutant weakens one field check of the protocol crate. A compromised key
# signs the invalid record, so the relay (or a malicious relay) stores it and the
# device accepts it. The reference invariant reads only the prefix.
[mutants.grantSealedUnchecked]
base = "compromisedReorder"
caught_by = "grantSealsAllKeys"

[mutants.epochSkipAllowed]
base = "compromisedReorder"
caught_by = "epochSequential"

[mutants.selfRemovalAllowed]
base = "compromisedReorder"
caught_by = "noSelfRemoval"

[mutants.grantActiveSubject]
base = "compromisedHonest"
caught_by = "grantSubjectNew"

# [LOG-7] A retry after stale_base needs a new confirmation if a grant or a
# removal arrived. Two devices cannot reach it: the other grant needs a third
# device that is not the subject (finding S1).
[mutants.resignNoReconfirm]
base = "honest4"
caught_by = "tests"
test_module = "spacelogTest4"
test = "resignReconfirmTest"

# ---------------------------------------------------------------- exhaustive (TLC)
# TLC checks every reachable state of a small config, at any depth. Each listed
# mutant must also fail on the same config, so the config is big enough to
# matter.

[[exhaustive]]
config = "tinyHonest"
invariants = [
  "authorActive", "noKeyToRemoved", "removedKeyIsolation", "baseRule",
  "activeSetDeterministic", "grantAuthorized", "forkStops", "baseInOwnLog",
  "writeEpochCurrent", "relayLogValid", "logChangeEpoch", "noFork",
  "noStaleChangeStored", "grantConfirmed",
]
mutants = ["epochSealsToAll", "verifierIgnoresRemovals"]
why = "An honest relay with 2 devices and 4 records: about 9 000 states, 13 seconds."

[[exhaustive]]
config = "tinyHonest4"
invariants = ["baseRule", "relayLogValid"]
mutants = ["noBaseRule", "relayNoBaseRule"]
why = "Two grants on one base need 4 devices (finding S1). 3 records keep it to 29 seconds: 4 records did not finish in 15 minutes."

[[exhaustive]]
config = "tinyThief"
invariants = [
  "authorActive", "noKeyToRemoved", "removedKeyIsolation", "baseRule",
  "activeSetDeterministic", "grantAuthorized", "forkStops", "baseInOwnLog",
  "writeEpochCurrent", "relayLogValid", "logChangeEpoch", "noFork",
  "noStaleChangeStored", "grantConfirmed",
]
why = "A thief ignores its own removal: about 35 000 states, 77 seconds."

[[exhaustive]]
config = "tinyFork"
invariants = [
  "authorActive", "noKeyToRemoved", "removedKeyIsolation", "baseRule",
  "activeSetDeterministic", "grantAuthorized", "forkStops", "baseInOwnLog",
  "writeEpochCurrent", "logChangeEpoch",
]
why = "A relay that serves two branches, one attack: about 44 000 states, 91 seconds."

[[exhaustive]]
config = "tinyCompromised"
invariants = [
  "authorActive", "noKeyToRemoved", "removedKeyIsolation", "baseRule",
  "activeSetDeterministic", "grantAuthorized", "forkStops", "baseInOwnLog",
  "writeEpochCurrent", "logChangeEpoch", "grantSealsAllKeys", "epochSequential",
  "noSelfRemoval", "grantSubjectNew", "grantConfirmed",
]
mutants = ["grantSealedUnchecked", "epochSkipAllowed"]
why = "A compromised key and a malicious relay, 2 devices, 3 records, 2 adversary actions (bounded templates only)."
