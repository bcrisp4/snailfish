# Checks for the space log model. specs/tools/verify.py reads this file.
# Each [config] binds every const of model.qnt. verify.py generates one module
# file for each config and each mutant in specs/spacelog/_gen/.

model = "model.qnt"
module = "spacelog"
tests = "test.qnt"
test_module = "spacelogTest"
# Extra test modules with other consts: 4 devices, and a thief.
test_modules = ["spacelogTest4", "spacelogTestThief"]

# Invariants that hold in every config unless a config lists it under `skip`
# or a [[limits]] entry names it.
invariants = [
  "authorActive", "noKeyToRemoved", "removedKeyIsolation", "baseRule",
  "activeSetDeterministic", "grantAuthorized", "forkStops", "baseInOwnLog",
  "writeEpochCurrent", "relayLogValid", "logChangeEpoch", "noFork",
  "noStaleChangeStored",
]

witness_configs = ["honest", "forkRelay", "forgeRelay", "reorderRelay", "thief"]
witness_steps = 40

fast_config = "honest"

[deep]
config = "honest"
invariants = ["authorActive", "noKeyToRemoved", "baseRule", "activeSetDeterministic"]
max_steps = 8

[defaults]
DEVS = "Set(1, 2)"
BAD = "Set()"
MAX_REC = "6"
MAX_ATTACKS = "0"
FAULTS = "Set()"
BUG = '"none"'

# ---------------------------------------------------------------- configs

[configs.honest]

[configs.forkRelay]
MAX_ATTACKS = "3"
FAULTS = 'Set("fork")'
skip = ["noFork", "noStaleChangeStored"]
why = "A fork can split honest devices on two valid branches (limit T7). A withheld epoch record can store a stale change (limit T8). Both are checked in the limit entries."

[configs.forgeRelay]
MAX_ATTACKS = "2"
FAULTS = 'Set("forge")'
skip = ["relayLogValid"]
why = "A malicious relay appends a record with no signature, so its log is not valid by design. Only an honest relay promises relayLogValid (checked in honest and thief)."

[configs.reorderRelay]
MAX_ATTACKS = "3"
FAULTS = 'Set("reorder")'
skip = ["relayLogValid", "noStaleChangeStored"]
why = "A malicious relay appends records in any order, so its log is not valid by design (relayLogValid). It can also store a change after a later epoch record (limit T8, checked in forkRelay)."

[configs.thief]
BAD = "Set(2)"
FAULTS = 'Set("recovery")'

# Baseline for the base-rule and key mutants. Two devices are not enough: with
# 2 devices, each pair of security records fails another check before the base
# rule, so those mutants change no verdict (finding S1).
[configs.honest4]
DEVS = "Set(1, 2, 3, 4)"
MAX_REC = "8"
check_only = ["baseRule", "relayLogValid"]
why = "Each 4-device run takes about 15 minutes. The baseline needs only the invariants that its mutants are caught by. honest checks the rest with 2 devices."

# ---------------------------------------------------------------- known limits

[[limits]]
config = "forkRelay"
invariant = "noFork"
why = "T7: a malicious relay serves two valid branches to two devices. Neither device sees a conflict until it compares logs."

[[limits]]
config = "forkRelay"
invariant = "noStaleChangeStored"
why = "T8 limit: a relay that withholds an epoch record from a stayed device can store that device's change under the old epoch."

# ---------------------------------------------------------------- mutants

[mutants.noBaseRule]
base = "honest4"
caught_by = "baseRule"

[mutants.relayNoBaseRule]
base = "honest4"
caught_by = "relayLogValid"

[mutants.relaySkipsCheck]
base = "honest"
caught_by = "relayLogValid"

[mutants.verifierIgnoresRemovals]
base = "honest"
caught_by = "activeSetDeterministic"

[mutants.epochSealsToAll]
base = "honest"
caught_by = "noKeyToRemoved"

[mutants.trustsRelayVerdict]
base = "forgeRelay"
caught_by = "grantAuthorized"

[mutants.noSigCheck]
base = "forgeRelay"
caught_by = "grantAuthorized"

[mutants.baseUnchecked]
base = "forkRelay"
caught_by = "baseInOwnLog"

[mutants.grantFromRemoved]
base = "thief"
caught_by = "tests"
test_module = "spacelogTestThief"
test = "thiefGrantTest"

[mutants.regrantRemoved]
base = "honest"
caught_by = "noKeyToRemoved"

[mutants.epochUnchecked]
base = "honest"
caught_by = "logChangeEpoch"

[mutants.staleWriteEpoch]
base = "honest"
caught_by = "writeEpochCurrent"

[mutants.resignReusesKey]
base = "honest4"
caught_by = "tests"
test_module = "spacelogTest4"
test = "resignTest"