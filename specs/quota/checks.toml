model = "model.qnt"
module = "quota"
tests = "test.qnt"
test_module = "quotaTest"
invariants = ["withinQuota", "noLostChange", "servesStored", "securityNotBlocked", "quotaReported",
              "withinReserve", "honestSecurityStored"]
test_modules = ["quotaTestThief"]
fast_config = "bounded"
# The block can come at any step, so the thief seldom reaches its limit in
# thief: 0 to 5 of 5000 traces (CI seed missed it on 443234d). tinyThief has a
# limit of 1 and reaches it in about 20 traces of each run.
witness_configs = ["bounded", "thief", "tinyThief"]
witness_steps = 20

[deep]
config = "tiny"
invariants = ["withinQuota", "noLostChange", "servesStored", "securityNotBlocked", "quotaReported",
              "withinReserve", "honestSecurityStored"]
# TLC checks the complete tiny state graph. This is a bounded cross-check.
max_steps = 6

[defaults]
QUOTA = "2"
MAX_QUOTA = "3"
MAX_RECORDS = "4"
RESERVE = "4"
LIMIT = "2"
THIEF = "false"
BUG = '"none"'

[configs.bounded]

# Device 2 is a thief. The reserve holds the daily limit of the thief and one
# removal, so the limit is what keeps room for the removal.
[configs.thief]
THIEF = "true"
RESERVE = "3"
MAX_RECORDS = "5"

# A reserve smaller than the daily limit of the thief: only the reserve check
# keeps the stored security records within the reserve.
[configs.reserveSmall]
THIEF = "true"
RESERVE = "2"
LIMIT = "3"
skip = ["honestSecurityStored"]
why = "The reserve is smaller than the daily limit, so the thief can fill it by design. thief checks honestSecurityStored with a correctly sized reserve."

[configs.tiny]
QUOTA = "1"
MAX_QUOTA = "2"
MAX_RECORDS = "3"

[mutants.noQuota]
base = "bounded"
caught_by = "withinQuota"

[mutants.quotaDrops]
base = "bounded"
caught_by = "noLostChange"

[mutants.quotaBlocksFetch]
base = "bounded"
caught_by = "servesStored"

[mutants.quotaBlocksSecurity]
base = "bounded"
caught_by = "securityNotBlocked"

# A sampled run of 5000 traces can miss the thief flood before the removal
# (CI seed 0x397f96de5ba9a198), so a named scenario catches it. TLC checks it
# on every state of tinyThief.
[mutants.noSecurityLimit]
base = "thief"
caught_by = "tests"
test_module = "quotaTestThief"
test = "thiefLimitedTest"

[mutants.noReserve]
base = "reserveSmall"
caught_by = "withinReserve"

[mutants.quotaNoPause]
base = "bounded"
caught_by = "quotaReported"

[[exhaustive]]
config = "tiny"
invariants = ["withinQuota", "noLostChange", "servesStored", "securityNotBlocked", "quotaReported",
              "withinReserve", "honestSecurityStored"]
mutants = ["noQuota", "quotaDrops", "quotaBlocksFetch", "quotaBlocksSecurity", "quotaNoPause"]
why = "Two devices, at most three records of size 1 or 2, a quota of 1 that the operator can raise to 2."

[configs.tinyThief]
QUOTA = "1"
MAX_QUOTA = "2"
THIEF = "true"
RESERVE = "2"
LIMIT = "1"
MAX_RECORDS = "4"

[[exhaustive]]
config = "tinyThief"
invariants = ["withinQuota", "noLostChange", "servesStored", "securityNotBlocked", "quotaReported",
              "withinReserve", "honestSecurityStored"]
mutants = ["noSecurityLimit"]
why = "A thief with a daily limit of 1, a reserve of 2 and at most four records."
