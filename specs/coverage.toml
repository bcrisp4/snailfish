# Rules of DESIGN.md that no Quint model encodes yet.
# A rule that a model encodes carries a `// [ID]` comment in model.qnt or test.qnt instead.
# `specs/tools/rules.py check` fails if a rule is in neither place.
# `partial` lists cited rules with a part that no model encodes yet.

[partial]
"USR-1" = "specs/signin checks the hash and that only the holder of the token registers a passkey. It does not check one use or the 7 day expiry, because ProVerif has no time and a table row cannot be removed. Rust: crates/relay/tests/user.rs invite tests"
"USR-4" = "specs/signin checks the PKCE binding. It does not check one use, the 60 second expiry or the redirect URI binding. Rust: crates/relay/tests/user.rs handoff tests"
"USR-5" = "specs/signin checks the device binding. It does not check the 10 minute expiry. Rust: crates/relay/tests/user.rs handoff tests"
"ENR-9" = "ProVerif checks the grant, the checkpoint signature and that the new device uploads nothing before both checks. It does not check the log from the genesis record. specs/spacelog checks the log up to the checkpoint (fetchOne). Rust: crates/engine enrollment tests"
"STO-12" = "specs/quota models a block as the refusal of every request of the blocked device. The order of the tenant file check before the space file is a relay storage rule. Rust: crates/relay/tests block tests"
"STO-15" = "specs/quota checks the reserve and the daily limit per author, with one run as one relay day. The 16 MiB default and the relay day are constants of the relay. Rust: crates/relay/tests (reserve and security_limit)"
"VER-6" = "specs/levels models a level as an int. The set of record versions of each level is a table in crates/protocol (records::level_types). Rust: crates/protocol space tests with a synthetic level 2"
"VER-9" = "specs/levels checks that each new record has the write level or above. It does not model a repair upload of a lost record at its old position, which specs/epochs and specs/delivery cover without levels. Rust: crates/relay repair tests"
"VER-10" = "specs/levels checks that a removal ends a block of a raise. The user page list of the devices that block a raise is presentation. Rust: crates/relay/tests/user.rs"

"CMP-1" = "specs/compaction keeps the kind and the change id of a stub and reads no other field of it. The entry hash and the stub JSON are byte-level. Rust: crates/relay/tests/vectors.rs compaction_cases_return_the_vector_results (stub JSON and digests against the Go reference), crates/protocol wire fetch_round_trip_and_entry_forms, fuzz targets wire and repair"
"CMP-3" = "specs/compaction checks the state position. The state digest and the size limits are byte-level. Rust: crates/relay/tests/vectors.rs compaction case snapshot-and-accept-checks, crates/engine tests::compaction::snapshot_over_the_relay_limit_is_not_written"
"CMP-7" = "specs/compaction checks that a removal ends the block. The user page marker is presentation. Rust: crates/relay/tests/user.rs page_marks_the_device_that_blocks_compaction"
"CMP-18" = "specs/compaction checks a reserve on top of the quota for snapshots and accept records. The reserve size of 14.6 is a relay constant. Rust: crates/relay/tests/vectors.rs compaction case reserve"
"CMP-19" = "specs/compaction checks that stubs do not count against the quota. The operator report of stub count and size is outside the model. Rust: crates/relay/tests/user.rs page_marks_the_device_that_blocks_compaction (space_status), vectors.rs compaction cases (usage after each step)"
"LOG-13" = "specs/forkrepair checks that a device that sees the deletion marker uploads nothing and that only the import makes the space exist again. The signed statement, its head and expiry checks and the recovery-key path are byte-level and relay rules. Rust: crates/relay/tests (delete tests), crates/engine tests (stopped: deleted)"
"DLV-13" = "specs/compaction marks a pull of a change that the device has no key for. Decryption and parse failures of the bytes are not modelled. Rust: crates/engine skip tests"

