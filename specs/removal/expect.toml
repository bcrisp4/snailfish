# Expected ProVerif results. One table for each .pv file in this directory.
# Each key is a stable substring of one query as ProVerif prints it in a RESULT line.
# Values: "true" (query holds), "false" (attack found), "reachable" (a `not event(X)`
# query that ProVerif reports as false, so the event can happen).
# specs/tools/proverif.py checks that each RESULT line matches exactly one key.

["removal.pv"]
"&& attacker(k" = "true"
"not attacker(sdata" = "true"
"==> event(TRotates" = "true"
"not event(TRotates" = "reachable"
"not event(SAccepts" = "reachable"

["seal_to_removed.pv"]
"&& attacker(k" = "false"
"not attacker(sdata" = "false"
"==> event(TRotates" = "true"
"not event(TRotates" = "reachable"
"not event(SAccepts" = "reachable"

["epoch_unsigned.pv"]
"&& attacker(k" = "true"
"not attacker(sdata" = "false"
"==> event(TRotates" = "false"
"not event(TRotates" = "reachable"
"not event(SAccepts" = "reachable"

["seal_to_old_recovery.pv"]
"&& attacker(k" = "false"
"not attacker(sdata" = "false"
"==> event(TRotates" = "true"
"not event(TRotates" = "reachable"
"not event(SAccepts" = "reachable"
