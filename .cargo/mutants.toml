# cargo-mutants config. Run `cargo mutants -p <crate>`.
# A surviving mutant needs a new test, or an entry in exclude_re with a reason.
test_tool = "nextest"
# The nextest `mutants` profile in .config/nextest.toml stops at the first
# failed test and omits the slow uniffi-bindgen test.
additional_cargo_test_args = ["--profile", "mutants"]
# The cargo `mutants` profile in Cargo.toml builds without debug info.
profile = "mutants"
# Do not copy ignored files (fuzz targets, venvs, worktrees under .agents/)
# into each build directory.
gitignore = true
# A package with no tests makes nextest exit 4 ("no tests to run"), and
# cargo-mutants counts that as a caught mutant. A mutant in crates/bindings
# must fail a real test, so every mutant runs the tests of the whole
# workspace, also crates/bindings/tests.
test_workspace = true
timeout_multiplier = 3.0
# Kani proofs and fuzz targets are not unit tests. Do not mutate them.
exclude_globs = ["**/fuzz/**"]
exclude_re = [
  # Only generates_python_module_for_the_binding_library catches this mutant.
  # The nextest `mutants` profile omits that test, and `make check` runs it.
  "uniffi-bindgen/src/main.rs:.*: replace main with \\(\\)",
  # The `proofs` modules are `cfg(kani)`. cargo-mutants still mutates them,
  # and no unit test can run them, so each mutant there shows as MISSED.
  # `make rust-kani` checks them instead.
  "proofs::",
  # Equivalent mutants: the two operands have no set bit in common (a high
  # nibble shifted left by 4 and a low nibble, or a value shifted left by 5
  # or 8 and the next symbol or byte), so `|` and `^` give the same result.
  "replace \\| with \\^ in decode_id",
  "replace \\| with \\^ in display",
  "replace \\| with \\^ in parse",
  # SQLite open flags are distinct bits, so `|` and `^` give the same value.
  "replace \\| with \\^ in open",
  # serde calls `expecting` only for a value type that the visitor does not
  # handle. The visitor handles every JSON type, so serde_json never calls it.
  "Visitor<'de> for Visit>::expecting",
  # Equivalent mutant: with `<=`, a relay head equal to the verified head
  # takes the repair branch, finds the same digest and plans a repair with
  # no lost entry. Sync::next_request skips an empty repair, and the fetch
  # already handled the head as caught up, so the result is the same.
  "replace < with <= in Sync::fetch",
  # Only an I/O fault other than NotFound reaches these error arms, and a
  # test cannot make one portably. The `restore` tests cover the NotFound
  # and success paths.
  "replace match guard e.kind\\(\\) == std::io::ErrorKind::NotFound with true in remove_tree",
  "replace match guard e.kind\\(\\) == std::io::ErrorKind::NotFound with true in remove_db",
  # restore renames the copied directory.db over the old one, so a
  # remove_db that does nothing leaves only -wal and -shm files of a
  # closed database, which hold no frames. The result is the same.
  "replace remove_db -> Result<\\(\\), OpsError> with Ok\\(\\(\\)\\)",
  # The enrollments hold keys and nonces, so their Debug output names the
  # step and the state only. An empty Debug output changes no behaviour
  # and leaks nothing, so no test can tell it from the original.
  "impl std::fmt::Debug for TrustedEnrollment>::fmt",
  "impl std::fmt::Debug for NewEnrollment>::fmt",
  # Equivalent mutants in M4: protocol level 1 is the only level, so the
  # write level of each space and the level of each device are 1. A write
  # level of 0 or 1 gives the same verdict for every M4 device. M7 adds
  # levels, and its tests must cover this check.
  "replace write_level -> u64 with 0",
  "replace write_level -> u64 with 1",
  "replace < with > in TrustedEnrollment::on_session",
  # Only a storage fault inside the token exchange returns an error other
  # than `bad_setup`, and a test cannot make one portably. With `true`, that
  # fault commits the claimed nonce, which the refusal keeps anyway.
  "replace match guard e.code == \"bad_setup\" with true in Relay::setup_token",
  # Equivalent mutant: with `<=`, the expiry sweep keeps a ceremony whose
  # expiry is exactly now until the next sweep. `Auth::take` refuses it at
  # that time, so no finish can use it, and the next sweep drops it.
  "replace < with <= in Auth::keep",
]

# A TIMEOUT is a mutant that makes a loop never end, for example `n /= 10`
# changed to `n %= 10` in pae::write_decimal. cargo-mutants counts a timeout as
# a detected mutant. Only MISSED fails `make rust-mutants`.
