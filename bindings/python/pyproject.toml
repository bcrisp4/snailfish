[project]
name = "snailfish"
version = "0.1.0"
description = "Python binding for the Snailfish sync engine."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Ben Crisp" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]

[project.urls]
Repository = "https://github.com/bcrisp4/snailfish"
Issues = "https://github.com/bcrisp4/snailfish/issues"

# The wheel holds the UniFFI module and the native library of
# crates/bindings. maturin runs the uniffi-bindgen binary of the workspace, so
# the generated code matches the pinned UniFFI version. The release workflow
# (.github/workflows/release-python.yml) builds one wheel for each platform.
[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[tool.maturin]
bindings = "uniffi"
manifest-path = "../../crates/bindings/Cargo.toml"

# `uv run` must not build the wheel. The tests import the module that
# `make bindings-python` writes to build/.
[tool.uv]
package = false

[dependency-groups]
# The tests sign in with the software browser of the demo (demo/src).
dev = [
  "pytest==9.1.1",
  "ruff==0.17.2",
  "pyright==1.1.414",
  "cbor2==5.7.1",
  "cryptography==46.0.3",
]

[tool.pytest.ini_options]
addopts = ["--strict-markers", "-q"]
testpaths = ["tests"]
# `make bindings-python` writes snailfish.py and libsnailfish here.
pythonpath = ["build", "tests", "../../demo/src"]

[tool.ruff]
line-length = 88
extend-exclude = ["build"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "UP",
  "B",
  "SIM",
  "TC",
  "RUF",
  "PTH",
  "S",
  "T20",
  "ARG",
  "FBT",
  "A",
  "C4",
  "DTZ",
  "ISC",
  "PIE",
  "RSE",
  "RET",
  "TID",
]

[tool.ruff.lint.per-file-ignores]
# pytest uses bare assert statements.
"tests/*" = ["S101"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["tests"]
extraPaths = ["build", "tests", "../../demo/src"]
