# The `mutants` profile is for cargo-mutants only (.cargo/mutants.toml).
# `make rust-test` and `make check` use the default profile.
[profile.mutants]
# One failed test catches the mutant. Stop the other tests at once, because a
# caught mutant otherwise waits for the slowest test that is running.
fail-fast = { max-fail = 1, terminate = "immediate" }
# This test binary runs a second `cargo build` of the bindings in the dev
# profile, so it adds about 20 s to each mutant. It catches only the uniffi-bindgen `main`
# mutant, which .cargo/mutants.toml excludes. `make check` still runs it.
# The webhook send loop test waits for a background task with a short poll.
# It catches only the two `run` mutants that .cargo/mutants.toml excludes.
default-filter = "not binary_id(snailfish-uniffi-bindgen::generate) and not test(send_loop_delivers_messages_and_alerts)"
