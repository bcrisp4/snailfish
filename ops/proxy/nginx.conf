# Sample nginx configuration for a Snailfish relay (DESIGN.md "Logging").
#
# Start the relay on the loopback address, behind this proxy:
#
#   snailfish-relay serve --listen 127.0.0.1:8080 --trusted-proxy 127.0.0.1 \
#     --authority sync.example.net --metrics-listen 127.0.0.1:9464
#
# Replace sync.example.net with the public domain. It must be the same value
# as --authority, because devices sign the authority of each request.
# Replace the certificate paths with the paths of your ACME client.

events {}

http {
    # An access log holds client IP addresses. Turn it off.
    access_log off;
    # Error lines also hold the client address. Write only critical errors.
    error_log /var/log/nginx/error.log crit;
    server_tokens off;

    server {
        listen 80;
        listen [::]:80;
        server_name sync.example.net;
        # Devices and browsers use HTTPS only.
        return 301 https://sync.example.net$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name sync.example.net;

        ssl_certificate /etc/letsencrypt/live/sync.example.net/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sync.example.net/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Above max_request_bytes (default 24 MiB) plus the 1,024-byte repair
        # allowance. The relay applies the exact limit and returns its own
        # error.
        client_max_body_size 26m;

        # Only the public listener. Do not add a location for the metrics
        # listener (127.0.0.1:9464): Prometheus scrapes it directly.
        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            # The Host header exactly as the client sent it. $host drops the
            # port and changes the case.
            proxy_set_header Host $http_host;
            # One entry: the client address. This replaces a value that the
            # client sent. The relay reads the last entry.
            proxy_set_header X-Forwarded-For $remote_addr;
            # Pass the Location header of a response unchanged.
            proxy_redirect off;
        }
    }
}
